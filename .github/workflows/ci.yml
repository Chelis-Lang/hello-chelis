name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHELIS_VERSION: 0.16.1

# Primary gate: the released Chelis toolchain must check and test the corpus,
# regenerate Deep sidecars byte-for-byte, and lower the C-backend examples.

jobs:
  pin-conformance:
    name: pin consistency + conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      compiler-version: ${{ steps.pin.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject missing or conflicting workflow mirrors
        run: python3 scripts/check_workflow_pins.py

      - name: Resolve exact Reef compiler pin
        id: pin
        shell: bash
        run: |
          pin="$(awk -F '"' '/^compiler = "=/ { sub(/^=/, "", $2); print $2; exit }' reef.toml)"
          test -n "$pin"
          echo "version=$pin" >> "$GITHUB_OUTPUT"

      - name: Install the Reef-pinned Chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
        run: |
          gh release download --repo Chelis-Lang/chelis \
            --pattern chelisup.sh --output - | sh
          echo "$HOME/.chelis/bin" >> "$GITHUB_PATH"
          "$HOME/.chelis/bin/chelisup" install "${{ steps.pin.outputs.version }}"

      - name: Prove installed version and conformance
        run: |
          test "$(chelis --version)" = "chelis ${{ steps.pin.outputs.version }}"
          chelis reef conform audit --explain
          chelis reef conform bump-check --base origin/main

  chelis-native:
    name: format + Reef + native + generated + bridge gates
    runs-on: ubuntu-24.04
    needs: pin-conformance
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Build hello-chelis Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: hello-chelis:ci
          load: true
          secrets: |
            github_token=${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          # cache-from: type=gha (disabled: force fresh build after version bump)
          no-cache: true
          cache-to: type=gha,mode=max
          # Resolve the runtime from reef.toml; explicit shell mirrors remain
          # audited by scripts/check_workflow_pins.py.
          build-args: |
            CHELIS_VERSION=${{ needs.pin-conformance.outputs.compiler-version }}
            CORAL_VERSION=0.7.31
            NAUTILUS_VERSION=0.7.34
            SCHOOL_VERSION=0.1.10

      - name: Prove image toolchain pin
        run: |
          test "$(docker run --rm hello-chelis:ci chelis --version)" = \
            "chelis ${{ needs.pin-conformance.outputs.compiler-version }}"

      - name: Format, lint, and Reef front-end gates
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci bash -c '
            set -euo pipefail
            find src tests tests_neg tests_blocked verify -name "*.ch" -type f -print0 \
              | xargs -0 -n1 chelis fmt --check
            chelis lint --check .
            chelis reef build
          '

      - name: Native positive, negative, and blocked contracts
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci bash -c '
            set -euo pipefail
            timeout 1200s chelis test tests/ --jobs auto
            timeout 1200s chelis test tests_neg/ --expect neg
            timeout 1200s chelis test tests_blocked/ --expect blocked
          '

      - name: Deep and generated-negative drift
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci bash -c '
            set -euo pipefail
            python3 scripts/regen_deep.py --check
            python3 scripts/sync_negative_tests.py --check
          '

      - name: C backend, Octant, and c-earchin evidence
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci bash -c '
            set -euo pipefail
            pip install pytest --break-system-packages 2>/dev/null || pip install pytest
            python3 -m pytest -q \
              tests/test_c_backend.py \
              tests/test_octant_pairs.py \
              tests/test_c_earchin_artifacts.py
          '

  fallback-orchestration:
    name: pytest (fallback)
    runs-on: ubuntu-24.04
    needs: [pin-conformance, chelis-native]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Reuse hello-chelis image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: hello-chelis:ci
          load: true
          secrets: |
            github_token=${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          # cache-from: type=gha (disabled: force fresh build after version bump)
          no-cache: true
          build-args: |
            CHELIS_VERSION=${{ needs.pin-conformance.outputs.compiler-version }}
            CORAL_VERSION=0.7.31
            NAUTILUS_VERSION=0.7.34
            SCHOOL_VERSION=0.1.10

      # Independent Python orchestration/fallback over the complete harness.
      # See tests/README.md.
      - name: pytest tests/
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci bash -c '
            set -euo pipefail
            pip install pytest --break-system-packages 2>/dev/null || pip install pytest
            python3 -m pytest -q tests/
          '
