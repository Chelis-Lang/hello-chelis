name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Primary gate: `chelis test tests/` runs every Std.Test.assert_*
# inside the def test_*() functions in the .ch test files.
# Secondary lanes: chelis lint, chelis check, pytest for the cases
# Chelis-native doesn't cover (negative examples, octant pairs, audit
# chain greps).

jobs:
  chelis-native:
    name: chelis lint + check + test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build hello-chelis Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: hello-chelis:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: chelis lint --check
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            chelis lint --check .

      - name: chelis check (front-end gate)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            chelis check src/basics/hellotensor.ch

      - name: chelis test (the primary gate)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            chelis test tests/

  fallback-orchestration:
    name: pytest (fallback)
    runs-on: ubuntu-24.04
    needs: chelis-native
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Reuse hello-chelis image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: hello-chelis:ci
          load: true
          cache-from: type=gha

      # Negative examples + Octant pair regeneration + C-backend
      # audit-chain greps. See tests/README.md.
      - name: pytest tests/
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci bash -c '
            pip install pytest --break-system-packages 2>/dev/null || pip install pytest
            python3 -m pytest -q tests/
          '
