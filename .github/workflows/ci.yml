name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Primary gate: the released Chelis toolchain must check and test the corpus,
# regenerate Deep sidecars byte-for-byte, and lower the C-backend examples.

jobs:
  chelis-native:
    name: chelis inventory + check + test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build hello-chelis Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: hello-chelis:ci
          load: true
          secrets: |
            github_token=${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: chelis lint inventory (non-blocking)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            chelis lint .

      - name: chelis check (front-end gate)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            chelis check src/basics/hellotensor.ch

      - name: chelis test native suite
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            timeout 180s chelis test tests/ --jobs auto

      - name: Deep s-expression drift check (every .ch must match its .dp)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            python3 scripts/regen_deep.py --check

      # The IR evaluator doesn't ship every primitive. This lane builds
      # supported verify/*.ch files through `chelis build`, links against
      # libchelis_runtime + OpenBLAS, and golden-diffs native output.
      - name: chelis build (C-backend coverage)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci bash -c '
            pip install pytest --break-system-packages 2>/dev/null || pip install pytest
            python3 -m pytest -q tests/test_c_backend.py
          '

  fallback-orchestration:
    name: pytest (fallback)
    runs-on: ubuntu-24.04
    needs: chelis-native
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Reuse hello-chelis image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: hello-chelis:ci
          load: true
          secrets: |
            github_token=${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          cache-from: type=gha

      # Negative examples + Octant pair regeneration + C-backend
      # audit-chain greps. See tests/README.md.
      - name: pytest tests/
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci bash -c '
            pip install pytest --break-system-packages 2>/dev/null || pip install pytest
            python3 -m pytest -q tests/
          '
