name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  central:
    uses: Chelis-Lang/ci/.github/workflows/consumer-hello-chelis-ci.yml@1546f3d4f674c69c5bfd38621cc880d4d1b8fdf4
    with:
      chelis-version: 0.14.0
      coral-version: 0.7.30
      nautilus-version: 0.7.33
    secrets:
      CHELIS_RELEASE_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
