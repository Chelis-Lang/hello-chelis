name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The corpus gate. Everything runs inside the image built from
# docker/Dockerfile, which installs the pinned Chelis release, the Octant
# CLI, and the shell packages from their GitHub release assets.

jobs:
  corpus:
    name: check + lint + test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built fresh on every run so a toolchain or shell bump can never be
      # served from a stale layer. The version build-args must match
      # reef.toml (see AGENTS.md, Toolchain Policy).
      - name: Build hello-chelis Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: hello-chelis:ci
          load: true
          secrets: |
            github_token=${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          no-cache: true
          cache-to: type=gha,mode=max
          build-args: |
            CHELIS_VERSION=0.18.11
            CORAL_VERSION=0.7.43
            NAUTILUS_VERSION=0.7.46
            SCHOOL_VERSION=0.1.14

      # Offline pin guard (shell contract §2). Passes trivially when the reef
      # pin is unchanged against main; when it changed, it requires a green
      # conformance audit, so a raw pin edit that skips the Pin Bump
      # Checklist fails the PR.
      - name: Fetch base ref for the pin guard
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: chelis reef conform bump-check
        run: |
          # git inside the container refuses the runner-owned checkout
          # without a safe.directory grant.
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            bash -lc 'git config --global --add safe.directory /workspace && chelis reef conform bump-check --base origin/main'

      # Shell contract conformance. Fails on any MUST-tier row; MANUAL and
      # NA rows (row 5, hello-chelis#26) are reported but do not fail.
      - name: chelis reef conform audit
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            chelis reef conform audit

      - name: chelis lint --check
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            chelis lint --check .

      # Checking one file type-checks the whole package it belongs to.
      - name: chelis check
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            chelis check src/basics/hellotensor.ch

      - name: chelis test tests/
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            timeout 600s chelis test tests/ --jobs auto

      # Negative suite (shell contract §6). Each tests_neg/**/*.ch must be
      # rejected with the diagnostic substring pinned on line 1 of its
      # .expect sidecar. A case that starts passing is a checker regression,
      # not a fixture to update.
      - name: chelis test tests_neg --expect neg
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            chelis test tests_neg --expect neg

      # Surf/Deep drift, negative error kinds, C-backend build + run +
      # golden diff, Octant round-trips, and c-earchin proofs.
      # See tests/README.md.
      - name: pytest tests/
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            uv run --frozen --group test pytest -q tests/
