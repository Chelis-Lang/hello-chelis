name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  central:
    uses: Chelis-Lang/ci/.github/workflows/consumer-hello-chelis-release.yml@1546f3d4f674c69c5bfd38621cc880d4d1b8fdf4
    with:
      chelis-version: 0.14.0
      package-version: 0.1.11
    secrets:
      CHELIS_RELEASE_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
