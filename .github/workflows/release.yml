name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CHELIS_VERSION: 0.16.1
  PACKAGE_NAME: hello-chelis
  PACKAGE_VERSION: 0.1.11

jobs:
  build-reef-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject missing or conflicting workflow mirrors
        run: python3 scripts/check_workflow_pins.py

      - name: Resolve exact Reef compiler pin
        id: pin
        shell: bash
        run: |
          pin="$(awk -F '"' '/^compiler = "=/ { sub(/^=/, "", $2); print $2; exit }' reef.toml)"
          test "$pin" = "$CHELIS_VERSION"
          echo "version=$pin" >> "$GITHUB_OUTPUT"

      - name: Download Reef-pinned chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          PIN: ${{ steps.pin.outputs.version }}
        run: |
          gh release download "v${PIN}" \
            --repo Chelis-Lang/chelis \
            --pattern "chelis-v${PIN}-linux-x86_64.tar.gz" \
            --dir /tmp/chelis-toolchain
          tar -xzf "/tmp/chelis-toolchain/chelis-v${PIN}-linux-x86_64.tar.gz" \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-v${PIN}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: test "$(chelis --version)" = "chelis ${{ steps.pin.outputs.version }}"

      - name: Audit conformance and generated evidence
        run: |
          chelis reef conform audit --explain
          python3 scripts/regen_deep.py --check
          python3 scripts/sync_negative_tests.py --check

      - name: Build reef assets
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
        run: chelis reef build

      - name: Verify release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          test "${GITHUB_REF_NAME#v}" = "${PACKAGE_VERSION}"
          test -f "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.tar.zst"
          test -f "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.chb"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}.tar.zst
            dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}.chb
          generate_release_notes: true
          fail_on_unmatched_files: true
