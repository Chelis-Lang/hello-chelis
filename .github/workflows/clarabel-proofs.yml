name: Clarabel conditional proofs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/clarabel-proofs.yml'
      - 'docker/Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'reef.toml'
      - 'reef.lock'
      - 'src/capstone/clarabelcalibration.*'
      - 'tests/capstone/clarabelcalibration.*'
      - 'properties/clarabel_calibration.ch'
      - 'proof_controls/clarabel_reversed_quality.ch'
      - 'tests/test_clarabel_calibration.py'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: clarabel-proofs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: Clarabel conditional proof checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The same release-backed image as the regular corpus gives the proof
      # checks the pinned compiler and packages without charging unrelated PRs.
      - name: Build hello-chelis Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: hello-chelis:clarabel-proof
          load: true
          secrets: |
            github_token=${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          no-cache: true
          build-args: |
            CHELIS_VERSION=0.21.0
            CORAL_VERSION=0.7.51
            NAUTILUS_VERSION=0.7.57
            SHORELEAVE_VERSION=0.1.5
            SHOALS_VERSION=0.25.0
            CLARABEL_VERSION=0.1.1

      - name: Prove conditional and reversed claims
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:clarabel-proof \
            uv run --frozen --group test pytest -q tests/test_clarabel_calibration.py
