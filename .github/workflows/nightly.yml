name: nightly

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  full-sweep:
    name: check + pytest + valgrind
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: hello-chelis:nightly
          load: true
          secrets: |
            github_token=${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: chelis check
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:nightly \
            chelis check src/basics/hellotensor.ch

      - name: chelis test native suite
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:nightly \
            chelis test tests/ --jobs auto

      - name: pytest tests/
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:nightly bash -c '
            pip install pytest --break-system-packages 2>/dev/null || pip install pytest
            python3 -m pytest -q tests/
          '

      - name: Valgrind on built C output (subset)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:nightly bash -c '
            set -e
            for ex in src/basics/hellotensor.ch src/basics/gradbasic.ch; do
              out=$(mktemp)
              chelis build --target c "$ex" -o "$out"
              if [ -x "$out" ]; then
                valgrind --error-exitcode=1 --leak-check=full "$out"
              fi
            done
          '
