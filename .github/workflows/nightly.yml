name: nightly

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  central:
    uses: Chelis-Lang/ci/.github/workflows/consumer-hello-chelis-nightly.yml@1546f3d4f674c69c5bfd38621cc880d4d1b8fdf4
    secrets:
      CHELIS_RELEASE_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
