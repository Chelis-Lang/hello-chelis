name: nightly

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

# Nightly is the same surfaces as ci.yml but with the slower checks added:
# valgrind on the C output, Surf<->Deep round-trip on every example.

jobs:
  full-sweep:
    name: chelis test + valgrind + round-trip
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: hello-chelis:nightly
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: chelis test examples/   # primary gate
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:nightly \
            chelis test examples/

      - name: Negative examples, Octant pairs, audit chain
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:nightly \
            python3 -m pytest -q tests/

      - name: Valgrind on built C output (subset)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:nightly bash -c '
            set -e
            for ex in examples/01_language_basics/01_hello_tensor.ch \
                      examples/01_language_basics/08_grad_basic.ch; do
              out_dir=$(mktemp -d)
              chelis build --target c --out-dir "$out_dir" "$ex"
              if [ -x "$out_dir/main" ]; then
                valgrind --error-exitcode=1 --leak-check=full "$out_dir/main"
              fi
            done
          '
