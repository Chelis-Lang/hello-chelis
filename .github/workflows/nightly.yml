name: nightly

on:
  schedule:
    # 03:30 UTC every day — keeps the corpus honest against compiler tip
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  full-sweep:
    name: full example sweep + valgrind
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: hello-chelis:nightly
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Full pytest run (check + test + build + round-trip + lint + octant)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:nightly \
            python3 -m pytest -q tests/

      - name: Surf <-> Deep round-trip
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:nightly \
            python3 -m pytest -q tests/test_round_trip.py

      - name: Valgrind on built C output (subset)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:nightly bash -c '
            set -e
            for ex in examples/01_language_basics/01_hello_tensor.ch \
                      examples/01_language_basics/08_grad_basic.ch; do
              out_dir=$(mktemp -d)
              chelis build --target c --out-dir "$out_dir" "$ex"
              if [ -x "$out_dir/main" ]; then
                valgrind --error-exitcode=1 --leak-check=full "$out_dir/main"
              fi
            done
          '
