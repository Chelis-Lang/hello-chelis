name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: ruff + black on the test harness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.6.* black==24.*

      - name: ruff check
        run: ruff check tests/

      - name: black --check
        run: black --check tests/

  chelis-lint:
    name: chelis lint --check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: hello-chelis:lint
          load: true
          cache-from: type=gha

      - name: chelis lint --check
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:lint \
            chelis lint --check .
