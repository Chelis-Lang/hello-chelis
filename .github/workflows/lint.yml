name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  central:
    uses: Chelis-Lang/ci/.github/workflows/consumer.yml@49d55f7dee88e2227b07b16c335b40a5da105cee
    with:
      profile: lint
      chelis-version: 0.18.6
      chelis-linux-sha256: sha256:c9ed1239ea51a02899a9c6d6cfac0580b8708602d72e9a2b7618037c31720b1a
      chelis-darwin-sha256: sha256:08580435570c6fd44716f4d5c64117e973e379808cefeaaa97c8faefa2588f6c
      domain-lint: true
    secrets:
      CHELIS_RELEASE_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
