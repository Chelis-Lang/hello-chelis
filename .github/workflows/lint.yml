name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  central:
    uses: Chelis-Lang/ci/.github/workflows/consumer.yml@49d55f7dee88e2227b07b16c335b40a5da105cee
    with:
      profile: invalid-evidence
    secrets:
      CHELIS_RELEASE_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
