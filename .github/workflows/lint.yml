name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  central:
    uses: Chelis-Lang/ci/.github/workflows/consumer.yml@8774253ac229ca14b2d5ef131d540316b79e0518
    with:
      profile: lint
      chelis-version: 0.17.1
      chelis-linux-sha256: sha256:d3e6d057996622e3cc6bb1c063bc4d804c96553010b48ef42f98ef03328d078f
      chelis-darwin-sha256: sha256:549c0745bf995eb40a0bbed395c964e3b3c86e46c0ac14749237f3417a3cf569
      domain-lint: true
    secrets:
      CHELIS_RELEASE_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
