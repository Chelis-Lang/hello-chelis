name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# `chelis lint --check` runs in ci.yml, inside the toolchain image.

jobs:
  python:
    name: ruff + black on the test harness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: ruff check
        run: uv run --frozen --group lint ruff check tests/

      - name: black --check
        run: uv run --frozen --group lint black --check tests/
