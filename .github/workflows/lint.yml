name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# `chelis lint --check` runs in ci.yml, inside the toolchain image.

jobs:
  python:
    name: ruff + black on the test harness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: ruff check
        run: uv run --frozen --group lint ruff check tests/

      - name: black --check
        run: uv run --frozen --group lint black --check tests/

  required-chelis-lint:
    name: chelis lint inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build hello-chelis Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: hello-chelis:ci
          load: true
          secrets: |
            github_token=${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          no-cache: true
          build-args: |
            CHELIS_VERSION=0.18.13
            CORAL_VERSION=0.7.45
            NAUTILUS_VERSION=0.7.48
      - name: Check Chelis lint
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace hello-chelis:ci \
            chelis lint --check .
