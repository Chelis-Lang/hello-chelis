[project]
name = "hello-chelis-tests"
version = "0.1.0"
description = "Python harness for the hello-chelis example corpus"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
test = ["pytest>=8"]
lint = ["ruff==0.6.*", "black==24.*"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
